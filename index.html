<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD PROJECT | 次世代の視界</title>
    <style>
        /* --- Base & Reset --- */
        :root {
            --bg-color: #ffffff;
            --section-bg: #fbfbfd;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --link-color: #0066cc;
            --accent: #ff6b00;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Hiragino Kaku Gothic ProN", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Animations --- */
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-up { animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* --- Global Navigation --- */
        header {
            position: fixed;
            top: 0; width: 100%; height: 52px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex; align-items: center; justify-content: center;
        }
        .nav-inner {
            width: 100%; max-width: 980px; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 18px; font-weight: 600; text-decoration: none; color: var(--text-main); letter-spacing: -0.01em; }
        .nav-links a {
            font-size: 12px; font-weight: 400; text-decoration: none; color: var(--text-main);
            margin-left: 30px; opacity: 0.8; transition: opacity 0.3s;
        }
        .nav-links a:hover { opacity: 1; }

        /* --- Hero Section --- */
        .hero {
            text-align: center; padding: 160px 20px 100px;
            background-color: var(--bg-color);
        }
        .hero-badge {
            display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent);
            letter-spacing: 0.05em; margin-bottom: 16px; text-transform: uppercase;
        }
        .hero h1 {
            font-size: clamp(48px, 8vw, 80px); font-weight: 700; letter-spacing: -0.015em;
            margin-bottom: 20px; line-height: 1.05;
        }
        .hero p {
            font-size: clamp(18px, 3vw, 28px); font-weight: 400; color: var(--text-muted);
            max-width: 700px; margin: 0 auto 40px; line-height: 1.4;
        }
        .btn-primary {
            display: inline-block; background: var(--text-main); color: #fff;
            padding: 14px 28px; border-radius: 980px; font-size: 17px; font-weight: 400;
            text-decoration: none; transition: transform 0.3s, background 0.3s;
        }
        .btn-primary:hover { background: #000; transform: scale(1.02); }
        .hero-image {
            max-width: 980px; margin: 60px auto 0; padding: 0 20px;
        }
        .hero-image img {
            width: 100%; border-radius: 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.08);
            object-fit: cover;
        }

        /* --- Features Section (Expanded) --- */
        .features {
            background-color: var(--section-bg); padding: 120px 20px; text-align: center;
        }
        .features h2 { font-size: 40px; font-weight: 600; margin-bottom: 60px; letter-spacing: -0.01em; }
        .feature-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px; max-width: 980px; margin: 0 auto;
        }
        .feature-card {
            background: #fff; padding: 50px 30px; border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); text-align: left;
            height: 100%; /* 高さを揃えるため */
            transition: transform 0.3s ease, box-shadow 0.3s ease; /* アニメーション追加 */
        }
        .feature-icon {
            width: 48px; height: 48px; background: #f5f5f7; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 24px;
        }
        .feature-card h3 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
        .feature-card p { font-size: 16px; color: var(--text-muted); line-height: 1.6; }

        /* --- リンク用カードのスタイル --- */
        .feature-card-link {
            text-decoration: none; /* 下線を消す */
            color: inherit; /* テキストの色を親要素に合わせる */
            display: block;
