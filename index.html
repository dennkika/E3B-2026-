<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUDグラス製作プロジェクト</title>
    <style>
        /* --- 全体のリセットとApple風フォント設定 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Arial, sans-serif;
            background-color: #ffffff; /* Appleらしい白背景 */
            color: #1d1d1f; /* 墨のような濃いグレー */
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* --- グローバルナビゲーション（すりガラス効果） --- */
        header {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            position: fixed;
            top: 0;
            width: 100%;
            height: 48px;
            z-index: 9999;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
        }
        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
        }
        .nav-logo {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #1d1d1f;
            text-decoration: none;
        }
        .nav-links a {
            font-size: 12px;
            color: #1d1d1f;
            text-decoration: none;
            margin-left: 24px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        .nav-links a:hover {
            opacity: 1;
        }

        /* --- ヒーローセクション --- */
        .hero {
            text-align: center;
            padding-top: 140px;
            padding-bottom: 80px;
        }
        .hero-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            color: #bf4800; /* Appleの新製品タグ風のオレンジ */
            letter-spacing: 0.02em;
            margin-bottom: 12px;
        }
        .hero h1 {
            font-size: 56px;
            font-weight: 600;
            letter-spacing: -0.005em;
            margin-bottom: 15px;
        }
        .hero p {
            font-size: 24px;
            font-weight: 400;
            color: #86868b; /* サブテキスト用のグレー */
            max-width: 600px;
            margin: 0 auto 30px auto;
            line-height: 1.4;
        }
        
        /* Apple風の青色リンク */
        .cta-link {
            font-size: 21px;
            color: #0066cc;
            text-decoration: none;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            transition: text-decoration 0.3s;
        }
        .cta-link:hover {
            text-decoration: underline;
        }
        .cta-link::after {
            content: " >";
            font-size: 20px;
            margin-left: 5px;
        }

        /* --- プロダクト画像エリア --- */
        .product-image {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            margin-bottom: 100px;
        }
        .product-image img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08); /* 浮き出るようなシャドウ */
        }

        /* --- フッター --- */
        footer {
            background-color: #f5f5f7;
            padding: 40px 20px;
            text-align: center;
            font-size: 12px;
            color: #86868b;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="nav-logo">HUD PROJECT</a>
            <div class="nav-links">
                <a href="progress.html">進捗状況・活動報告</a>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <span class="hero-badge">課題研究プロジェクト</span>
            <h1>視線の先に、必要なすべてを。</h1>
            <p>HUDグラスの製作。視線を大きく動かさずに、情報をスマートに確認できる次世代の装置を目指して。</p>
            <a href="progress.html" class="cta-link">最新の進捗状況を見る</a>
        </section>

        <div class="product-image">
            <img src="https://via.placeholder.com/800x450/f5f5f7/1d1d1f?text=HUD+Glass+Concept+Image" alt="HUDグラスコンセプトイメージ">
        </div>
    </main>

    <footer>
        <p>&copy; 課題研究 HUDグラス製作プロジェクト All rights reserved.</p>
    </footer>

</body>
</html>
