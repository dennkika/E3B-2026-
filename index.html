<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD PROJECT | E3B ２班</title>
    <style>
        /* --- Base & Reset (Universal Design & Dark HUD Mode) --- */
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #595959;
            --border: #d1d5db;
            --accent: #1d4ed8; 
            --accent-glow: rgba(29, 78, 216, 0.15);
            --header-bg: rgba(248, 249, 250, 0.95);
            --font-main: "Helvetica Neue", Arial, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            --font-mono: "Courier New", Courier, monospace;
        }

        /* 🌙 サイバーHUDダークモード設定 */
        [data-theme="dark"] {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1f2937;
            --accent: #38bdf8; /* HUDサイバーブルー */
            --accent-glow: rgba(56, 189, 248, 0.2);
            --header-bg: rgba(11, 15, 25, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
        body {
            font-family: var(--font-main);
            background-color: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.8; 
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        body.loaded {
            overflow: auto;
        }

        /* --- Opening Animation (Loader) --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.86, 0, 0.07, 1), opacity 0.8s ease;
        }
        .loader-content { text-align: center; }
        .loader-text {
            display: block;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 0.15em;
            color: var(--text-main);
            margin-bottom: 15px;
            opacity: 0;
            transform: translateY(15px);
            animation: textReveal 0.6s cubic-bezier(0.215, 0.61, 0.355, 1) 0.2s forwards;
        }
        .loader-line {
            width: 0; height: 3px;
            background-color: var(--accent);
            margin: 0 auto;
            border-radius: 2px;
            animation: lineGrow 0.8s cubic-bezier(0.215, 0.61, 0.355, 1) 0.5s forwards;
            box-shadow: 0 0 8px var(--accent);
        }

        @keyframes textReveal { to { opacity: 1; transform: translateY(0); } }
        @keyframes lineGrow { 0% { width: 0; } 100% { width: 140px; } }

        body.loaded #loader {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        /* --- Header --- */
        header {
            position: fixed; top: 0; width: 100%; height: 70px;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            z-index: 1000; border-bottom: 1px solid var(--border); 
            display: flex; align-items: center; justify-content: center;
        }
        .nav-inner {
            width: 100%; max-width: 1000px; padding: 0 30px; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 18px; font-weight: bold; text-decoration: none; color: var(--text-main); letter-spacing: 0.1em; }
        .nav-right { display: flex; align-items: center; gap: 30px; }
        .nav-links { display: flex; gap: 25px; }
        .nav-links a {
            font-size: 14px; text-decoration: none; color: var(--text-muted); 
            letter-spacing: 0.05em; font-weight: bold; transition: color 0.3s;
            position: relative; padding: 25px 0;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .nav-links a.active::after {
            content: ''; position: absolute; left: 0; bottom: 0; width: 100%; height: 3px; background: var(--accent);
            border-radius: 3px 3px 0 0; box-shadow: 0 0 6px var(--accent);
        }

        /* ダークモード切り替えボタン */
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

        /* --- Layout --- */
        .container { max-width: 900px; margin: 0 auto; padding: 120px 30px 80px; min-height: calc(100vh - 80px); }
        .page-section { display: none; animation: fadeIn 0.4s ease-out forwards; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .section-header { margin-bottom: 50px; text-align: center; }
        .section-en { font-size: 14px; color: var(--accent); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; display: block; font-weight: bold; }
        .section-jp { font-size: 30px; font-weight: bold; letter-spacing: 0.05em; color: var(--text-main); }

        /* --- Tech Stack & Specs --- */
        .tech-wrapper {
            background: var(--card-bg); border-radius: 12px; padding: 25px; margin-bottom: 40px;
            border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .tech-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .tech-tags { display: flex; flex-wrap: wrap; gap: 10px; }
        .tech-tag {
            background: var(--bg-color); border: 1px solid var(--border); color: var(--text-muted);
            padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; font-family: var(--font-mono);
        }
        .tech-tag.highlight { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }

        /* --- Progress Section (#status) --- */
        .progress-wrapper { margin-bottom: 40px; background: var(--card-bg); padding: 35px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--border); }
        .progress-info { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; }
        .progress-label { font-size: 18px; font-weight: bold; }
        .progress-percent { font-size: 52px; font-weight: bold; line-height: 1; color: var(--accent); font-family: var(--font-mono); }
        .progress-track { width: 100%; height: 8px; background-color: var(--border); position: relative; border-radius: 4px; overflow: hidden; }
        .progress-fill { position: absolute; left: 0; top: 0; height: 100%; background-color: var(--accent); width: 0%; transition: width 1.5s cubic-bezier(0.215, 0.61, 0.355, 1); border-radius: 4px; box-shadow: 0 0 10px var(--accent); }

        .task-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 40px; }
        .task-item { padding: 20px 25px; background: var(--card-bg); font-size: 15px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; border-radius: 8px; border: 1px solid var(--border); }
        .task-item.done { border-color: #22c55e; }
        .task-item span.status { font-size: 11px; font-weight: bold; letter-spacing: 0.1em; border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px; background: var(--bg-color); }
        .task-item.done span.status { background: #22c55e; color: #fff; border-color: #22c55e; }

        /* --- Members Section --- */
        .member-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
        .member-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 22px; text-align: left;
        }
        .member-card.leader-card {
            border-color: var(--accent);
            background: linear-gradient(135deg, var(--card-bg) 0%, var(--accent-glow) 100%);
        }
        .member-role { font-size: 12px; color: var(--accent); font-weight: bold; letter-spacing: 0.1em; margin-bottom: 5px; text-transform: uppercase; }
        .member-name { font-size: 18px; font-weight: bold; color: var(--text-main); margin-bottom: 8px; }
        .member-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

        /* --- Gallery Section --- */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 15px; }
        .gallery-item {
            background: var(--bg-color); border: 2px dashed var(--border); border-radius: 8px; height: 160px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted);
            font-size: 13px; text-align: center; padding: 15px;
        }

        /* --- Report Section (#report) --- */
        .timeline { position: relative; padding-left: 30px; }
        .timeline::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 0; width: 3px; background: var(--border); border-radius: 2px; }
        .timeline-item { position: relative; margin-bottom: 50px; background: var(--card-bg); padding: 25px 30px; border-radius: 12px; border: 1px solid var(--border); }
        .timeline-item:last-child { margin-bottom: 0; }
        .timeline-item::before {
            content: ''; position: absolute; left: -36px; top: 32px; width: 14px; height: 14px; background: var(--accent); border: 3px solid var(--bg-color); border-radius: 50%; box-shadow: 0 0 8px var(--accent);
        }
        .timeline-date { font-size: 12px; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 8px; display: block; font-weight: bold; font-family: var(--font-mono); }
        .timeline-title { font-size: 18px; margin-bottom: 15px; font-weight: bold; }
        .timeline-content { font-size: 15px; color: var(--text-muted); line-height: 1.8; }
        .timeline-content ul { margin: 12px 0 0 20px; padding: 0; list-style-type: disc; }

        /* --- Future Section (#future) --- */
        .future-list { list-style: none; counter-reset: future-counter; }
        .future-list li {
            position: relative; padding: 25px 25px 25px 80px; margin-bottom: 16px; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border);
            font-size: 16px; font-weight: bold; display: flex; align-items: center;
        }
        .future-list li::before {
            content: "0" counter(future-counter); counter-increment: future-counter;
            position: absolute; left: 25px; font-size: 22px; font-weight: bold; color: var(--accent); font-family: var(--font-mono);
        }

        /* --- Footer --- */
        footer { text-align: center; color: var(--text-muted); font-size: 13px; padding: 40px 20px; border-top: 1px solid var(--border); letter-spacing: 0.05em; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-content">

    <header>

                    <span id="themeIcon">🌙</span> <span id="themeText">HUD</span>

                <div class="task-item done">

                </div>

                </div>
