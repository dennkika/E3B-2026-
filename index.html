<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD PROJECT | E3B ２班</title>
    <style>
        /* --- Base & Reset (Universal Design & Dark HUD Mode) --- */
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #595959;
            --border: #d1d5db;
            --accent: #1d4ed8; 
            --accent-glow: rgba(29, 78, 216, 0.15);
            --header-bg: rgba(248, 249, 250, 0.95);
            --font-main: "Helvetica Neue", Arial, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            --font-mono: "Courier New", Courier, monospace;
        }

        /* 🌙 サイバーHUDダークモード設定 */
        [data-theme="dark"] {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1f2937;
            --accent: #38bdf8; /* HUDサイバーブルー */
            --accent-glow: rgba(56, 189, 248, 0.2);
            --header-bg: rgba(11, 15, 25, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
        body {
            font-family: var(--font-main);
            background-color: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.8; 
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        body.loaded {
            overflow: auto;
        }

        /* --- Opening Animation (Loader) --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.86, 0, 0.07, 1), opacity 0.8s ease;
        }
        .loader-content { text-align: center; }
        .loader-text {
            display: block;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 0.15em;
            color: var(--text-main);
            margin-bottom: 15px;
            opacity: 0;
            transform: translateY(15px);
            animation: textReveal 0.6s cubic-bezier(0.215, 0.61, 0.355, 1) 0.2s forwards;
        }

            width: 0; height: 3px;
            background-color: var(--accent);
